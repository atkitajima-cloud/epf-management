<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPF Management</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">LOCAL PROJECT WORKSPACE</div>
      <h1>EPF Management</h1>
    </div>
    <div class="topbar-actions">
      <button id="wbsButton" class="button secondary">WBSを生成</button>
      <a class="button secondary nav-button" href="/gantt.html">ガント</a>
      <button id="pullButton" class="button secondary" disabled>Pull</button>
      <button id="commitPushButton" class="button secondary" disabled>Commit &amp; Push</button>
    </div>
  </header>

  <main class="workspace">
    <section class="board-panel" aria-labelledby="boardTitle">
      <div class="section-heading">
        <div>
          <h2 id="boardTitle">Project board</h2>
          <p>カードを列へ移動するとMarkdownのstatusが更新されます。</p>
        </div>
        <div class="heading-actions">
          <button id="newTaskButton" class="button primary">新規Task</button>
          <span id="taskCount" class="task-count">0 tasks</span>
        </div>
      </div>
      <section id="invalidTaskWarning" class="invalid-task-warning" hidden aria-live="polite">
        <strong>無効なTaskがあります</strong>
        <ul></ul>
      </section>
      <div id="board" class="board" aria-live="polite"></div>
    </section>

    <aside class="side-panel">
      <section class="history-panel" aria-labelledby="historyTitle">
        <div class="history-heading">
          <h2 id="historyTitle">変更履歴</h2>
          <button id="historyRefresh" class="icon-button" title="変更履歴を更新" aria-label="変更履歴を更新">↻</button>
        </div>
        <div id="historyList" class="history-list" aria-live="polite">確認中...</div>
      </section>

      <section class="git-panel">
        <div class="git-heading">
          <h2>Git</h2>
          <button id="gitRefresh" class="icon-button" title="Git状態を更新">↻</button>
        </div>
        <div id="gitStatus" class="git-status">確認中...</div>
      </section>
    </aside>
  </main>

  <dialog id="taskDialog" class="task-dialog">
    <form id="taskForm">
      <div class="dialog-heading">
        <div>
          <span id="dialogTaskId" class="task-id"></span>
          <h2>Task details</h2>
        </div>
        <button type="button" id="closeDialog" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <div class="form-grid">
        <label class="wide">タイトル<input name="title" required></label>
        <label>状態<select name="status" required></select></label>
        <label>担当者<select name="owner" required></select></label>
        <label>優先度<select name="priority"><option>high</option><option>medium</option><option>low</option></select></label>
        <label>対象リポジトリ<select name="target_repo" required></select></label>
        <label>開始日<input name="start" type="date"></label>
        <label>期限<input name="due" type="date"></label>
        <label class="wide">先行Task<input name="depends_on" placeholder="EPF-0001, EPF-0002"></label>
        <label>Requirement<input name="requirement" pattern="REQ-[0-9]{4}"></label>
        <label class="wide">本文<textarea name="body" rows="16"></textarea></label>
      </div>
      <div class="dialog-actions">
        <span id="saveStatus" class="save-status"></span>
        <a id="openTaskInVscode" class="button secondary" href="#" title="Task MarkdownをVS Codeで開く">VS CodeでTaskを開く</a>
        <button type="button" id="cancelDialog" class="button secondary">キャンセル</button>
        <button type="submit" class="button primary">Markdownへ保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="createDialog" class="task-dialog">
    <form id="createForm">
      <div class="dialog-heading">
        <div>
          <span class="task-id">新規</span>
          <h2>New task</h2>
        </div>
        <button type="button" id="closeCreateDialog" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <div class="form-grid">
        <label class="wide">タイトル<input name="title" required></label>
        <label>状態<select name="status" required></select></label>
        <label>担当者<select name="owner" required></select></label>
        <label>優先度<select name="priority"><option>high</option><option selected>medium</option><option>low</option></select></label>
        <label>対象リポジトリ<select name="target_repo" required></select></label>
        <label>開始日<input name="start" type="date"></label>
        <label>期限<input name="due" type="date"></label>
        <label class="wide">先行Task<input name="depends_on" placeholder="EPF-0001, EPF-0002"></label>
        <label>Requirement<select name="requirement"></select></label>
        <label class="wide">本文<textarea name="body" rows="12"></textarea></label>
      </div>
      <div class="dialog-actions">
        <span id="createStatus" class="save-status"></span>
        <button type="button" id="cancelCreateDialog" class="button secondary">キャンセル</button>
        <button type="submit" class="button primary">Markdownへ作成</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
